.sin(phase)*12,hip=side==='L'?180:220,knee=side==='L'?160:240;document.querySelector('#leg'+side).setAttribute('d',`M${hip} 194 L${knee} ${211-sign*Math.sin(phase)*7} L${x} ${y}`);const f=document.querySelector('#foot'+side);f.setAttribute('cx',x);f.setAttribute('cy',y);document.querySelector('#wheel'+side).setAttribute('transform',`translate(${side==='L'?145:252} 242) rotate(${phase*70})`)}document.querySelector('#crank').setAttribute('d',`M${200+Math.cos(phase)*22} ${233+Math.sin(phase)*12}L${200-Math.cos(phase)*22} ${233-Math.sin(phase)*12}`);document.querySelector('.stage').dataset.state=t===1?'held':'cycling';if(t<1)frame=requestAnimationFrame(draw)}draw(start);reduce.addEventListener('change',()=>{cancelAnimationFrame(frame);draw(performance.now())});window.addEventListener('pagehide',()=>cancelAnimationFrame(frame));</script></body></html>
